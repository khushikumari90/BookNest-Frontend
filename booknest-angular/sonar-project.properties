# SonarQube Project Properties — BookNest Angular Frontend
sonar.projectKey=booknest-frontend
sonar.projectName=BookNest Angular Frontend
sonar.projectVersion=1.0.0

# Source directory
sonar.sources=src
sonar.tests=src/__tests__

# TypeScript / JavaScript
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# SonarQube server — update token after login to http://localhost:9000
sonar.host.url=http://localhost:9000
sonar.token=YOUR_SONAR_TOKEN_HERE

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/main.ts,**/environments/**
sonar.coverage.exclusions=**/*.spec.ts,**/main.ts,**/environments/**
sonar.cpd.exclusions=**/*.spec.ts
